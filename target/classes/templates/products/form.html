<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Stockroom'">Product | Stockroom</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="shell shell-narrow">
    <header class="topbar">
        <a class="wordmark" th:href="@{/products}">STOCKROOM<span> / INVENTORY</span></a>
        <span class="topbar-note">PRODUCT MANAGEMENT</span>
    </header>
    <a class="back-link" th:href="@{/products}">&larr; All products</a>
    <section class="form-heading">
        <p class="eyebrow">CATALOG</p>
        <h1 th:text="${pageTitle}">Add product</h1>
        <p class="subheading">Enter the product details below.</p>
    </section>
    <form class="product-form" th:action="${formAction}" th:object="${product}" method="post">
        <div class="field">
            <label for="name">Product name</label>
            <input id="name" type="text" th:field="*{name}" maxlength="120" autocomplete="off" required>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
        </div>
        <div class="field">
            <label for="description">Description <span class="optional">OPTIONAL</span></label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</p>
        </div>
        <div class="field">
            <label for="price">Price</label>
            <div class="price-input"><span>$</span><input id="price" type="number" th:field="*{price}" min="0" step="0.01" required></div>
            <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</p>
        </div>
        <div class="form-actions">
            <a class="button button-secondary" th:href="@{/products}">Cancel</a>
            <button class="button button-primary" type="submit">Save product</button>
        </div>
    </form>
</main>
</body>
</html>
